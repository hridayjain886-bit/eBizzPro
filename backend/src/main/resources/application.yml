spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: ebizzpro-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ebizzpro}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CLIENT_ORIGIN:*}
  otp:
    ttl-minutes: ${VERIFY_OTP_TTL_MINUTES:15}
  google:
    web-client-id: ${GOOGLE_WEB_CLIENT_ID:}
  gstin-check:
    api-key: ${GSTINCHECK_API_KEY:}
    base-url: ${GSTINCHECK_BASE_URL:https://sheet.gstincheck.co.in/check}
  mail:
    from: ${MAIL_FROM:no-reply@ebizzpro.com}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
